name: Build Webview APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اسم التطبيق'
        required: true
      app_url:
        description: 'رابط الموقع'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK with Nativefier
        run: |
          # هذه الأداة ستصنع لك التطبيق من الرابط والاسم فوراً
          npx nativefier "${{ github.event.inputs.app_url }}" \
          --name "${{ github.event.inputs.app_name }}" \
          --platform android \
          --arch arm64

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Application Ready: ${{ github.event.inputs.app_name }}"
          files: ./*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
