name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اسم التطبيق'
        required: true
        default: 'My App'
      app_url:
        description: 'رابط الموقع'
        required: true
        default: 'https://google.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create App Project
        run: |
          cordova create myapp com.easy.builder "${{ github.event.inputs.app_name }}"
          cd myapp
          cordova platform add android
          # تعديل الكود لفتح الرابط المطلوب مباشرة
          echo '<script>window.location.href = "${{ github.event.inputs.app_url }}";</script>' > www/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd myapp
          # بناء نسخة Debug لتجنب مشاكل التوقيع الرقمي (التثبيت الفوري)
          cordova build android --debug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Generated-App
          # المسار الجديد لنسخة الـ Debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/*.apk
