name: Generate APK Final
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name'
        required: true
      app_url:
        description: 'URL'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK Directly
        run: |
          # استخدام أداة سريعة جداً ومباشرة تحول الرابط إلى APK
          docker run --rm -v ${{ github.workspace }}:/app-dir ghcr.io/viascom/nativefier-docker \
          "${{ github.event.inputs.app_url }}" \
          --name "${{ github.event.inputs.app_name }}" \
          --platform android \
          --arch arm64
          
      - name: Rename and Prepare
        run: |
          mv *.apk my-application.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}
          path: ./*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: ./*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
