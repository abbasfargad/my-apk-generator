name: Build Professional Webview APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اسم التطبيق'
        required: true
      app_url:
        description: 'رابط الموقع'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Nativefier and Build APK
        run: |
          # تثبيت الأداة وصنع التطبيق مباشرة من الرابط والاسم اللي دزيتهم من الموبايل
          npx nativefier "${{ github.event.inputs.app_url }}" \
          --name "${{ github.event.inputs.app_name }}" \
          --platform android \
          --arch arm64

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Application Ready: ${{ github.event.inputs.app_name }}"
          files: ./*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
