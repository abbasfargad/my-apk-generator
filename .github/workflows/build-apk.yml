name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اسم التطبيق المراد صنعه'
        required: true
        default: 'My App'
      app_url:
        description: 'رابط الموقع المراد تحويله إلى تطبيق'
        required: true
        default: 'https://google.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Webview App
        run: |
          cordova create myapp com.example.app "${{ github.event.inputs.app_name }}"
          cd myapp
          cordova platform add android
          
          # هنا الخدعة: الكود يمسح الصفحة الافتراضية ويحط كود يحول للرابط اللي يريده المستخدم تلقائياً
          echo '<script>window.location.href = "${{ github.event.inputs.app_url }}";</script>' > www/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd myapp
          cordova build android --release

      - name: Upload APK Resource
        uses: actions/upload-artifact@v4
        with:
          name: Generated-APK
          path: myapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
