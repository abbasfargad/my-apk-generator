name: Ultimate APK Generator
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name'
        required: true
      app_url:
        description: 'URL'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # هذه الأداة ستبني التطبيق كـ PWA/Webview بشكل مباشر وسريع
      - name: Build APK
        run: |
          npm install -g @bubblewrap/cli
          # إنشاء تطبيق أندرويد حقيقي من الرابط
          yes | bubblewrap init --url="${{ github.event.inputs.app_url }}"
          bubblewrap build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}
          path: ./*.apk
