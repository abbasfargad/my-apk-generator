name: ADA PLUS FINAL
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name'
        required: true
      app_url:
        description: 'URL'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create Webview Project
        run: |
          # أداة تحويل الروابط لبرامج أندرويد
          npm install -g nativefier
          nativefier "${{ github.event.inputs.app_url }}" --name "${{ github.event.inputs.app_name }}" --platform android --arch arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}
          path: ./*.apk
